# Paste into the `server { ... }` block for bravoapp.ai, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# This site is served by nginx (1.18.0, Ubuntu), which does NOT read Netlify's
# `_redirects` or Apache's `.htaccess`. Redirects have to live here, which is why
# this file is checked in rather than shipped in the build — so the rule is not
# lost the next time the server is rebuilt.

# ---------------------------------------------------------------------------
# 2026-08-11 — "Bravo Tech Sessions" renamed to "Bravo AI Sessions".
# 301 (permanent) so search engines transfer the old URL's ranking to the new
# one instead of treating it as a separate page. Both forms are listed because
# nginx does not add the trailing slash before matching an exact `location =`.
# ---------------------------------------------------------------------------
location = /blog/bravo-tech-sessions-vol-3/ {
    return 301 https://bravoapp.ai/blog/bravo-ai-sessions-vol-3/;
}
location = /blog/bravo-tech-sessions-vol-3 {
    return 301 https://bravoapp.ai/blog/bravo-ai-sessions-vol-3/;
}

# The post's social-preview image moved with it.
location = /blog-hero-tech-sessions-3.jpg {
    return 301 https://bravoapp.ai/blog-hero-ai-sessions-3.jpg;
}

# ---------------------------------------------------------------------------
# Favicon cache. The default here is 30 days, and because /favicon.svg is not
# content-hashed (Vite fingerprints JS/CSS, but files in public/ are copied
# verbatim) an icon change takes up to a month to reach returning visitors.
# A day is long enough to be free and short enough to iterate.
# ---------------------------------------------------------------------------
location = /favicon.svg {
    add_header Cache-Control "public, max-age=86400";
}
