# Waitlist API — nginx reverse proxy.
#
# Paste into the same `server { ... }` block for bravoapp.ai that holds
# nginx-redirects.conf, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Checked in for the same reason as the redirects: so the rule is not lost the
# next time the server is rebuilt.
#
# This is what keeps the browser same-origin. The page posts to /api/waitlist on
# bravoapp.ai; nginx hands it to the local service; only that service ever holds
# the Neon connection string. No CORS headers are needed or wanted — a
# cross-origin caller should be refused, and the absence of CORS does that.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    # The API rate-limits per client IP and reads it from this header. Without
    # it every request would appear to come from 127.0.0.1 and the limit would
    # apply to the whole internet at once.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # A signup is one small JSON object; anything larger is refused by nginx
    # before it reaches Node.
    client_max_body_size 4k;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # Never cache an API response.
    add_header Cache-Control "no-store" always;
}

# Optional but recommended: a second layer of rate limiting at the edge, so
# floods are dropped before they occupy a Node request slot. Requires this line
# in the `http { ... }` block of /etc/nginx/nginx.conf (it cannot live here):
#
#   limit_req_zone $binary_remote_addr zone=waitlist:10m rate=10r/m;
#
# Then uncomment inside the location block above:
#
#   limit_req zone=waitlist burst=5 nodelay;
#   limit_req_status 429;
